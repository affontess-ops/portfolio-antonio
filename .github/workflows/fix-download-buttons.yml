name: Fix portfolio downloads

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-portfolio:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PDF conversion tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libreoffice

      - name: Apply portfolio changes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('src/routes/index.tsx')
          s = p.read_text(encoding='utf-8')

          s = s.replace('Copywriting · Marketing de Conteúdo', 'Copywriting · Marketing Digital')
          s = s.replace('"Marketing de Conteúdo",\n  "Planejamento Editorial"', '"Marketing Digital",\n  "Planejamento Editorial"')

          s = re.sub(
              r'Cada cargo tem um \{" "\}.*?que prova o impacto\. Todos rastreáveis, nenhum inventado\.',
              'Estratégia se mede pelo <em className="not-italic italic text-accent">impacto.</em> Aqui, cada resultado tem um indicador por trás.',
              s,
              count=1,
              flags=re.S,
          )
          s = s.replace(
              'Cada cargo tem um número que prova o impacto. Todos rastreáveis, nenhum inventado.',
              'Estratégia se mede pelo impacto. Aqui, cada resultado tem um indicador por trás.'
          )

          s = re.sub(
              r'Peças que\s*<em[^>]*>assinei</em>\s*<br\s*/?>\s*na BrasilCard e BOLT\.',
              'Campanhas e conteúdos desenvolvidos para <em className="italic not-italic text-accent">BrasilCard.</em>',
              s,
              count=1,
              flags=re.S,
          )

          s = s.replace(
              'type Piece = { badge: string; client: string; src: string; alt: string };',
              'type Piece = { badge: string; client: string; src: string; alt: string };\n' 
          )

          s = s.replace(
              'const campaigns: { name: string; intro: string; strategy: string; pieces: Piece[] }[] = [',
              'const campaigns: { name: string; intro: string; strategy: string; channels: string[]; indicators: string[]; results?: { label: string; value: string }[]; pieces: Piece[] }[] = ['
          )

          recarga_anchor = '''    pieces: [
      {
        badge: "Feed · Instagram",
        client: "BrasilCard · Cliente Final",
        src: recargaFeed.url,'''
          recarga_insert = '''    channels: ["Instagram", "Site", "App"],
    indicators: ["Cliques para o site", "Acessos ao App", "Alcance no Instagram", "Interações com a publicação", "Conversões"],
    results: [
      { label: "Cliques", value: "12.400" },
      { label: "CTR", value: "35%" },
      { label: "Conversões", value: "2.800" },
    ],
    pieces: [
      {
        badge: "Feed · Instagram",
        client: "BrasilCard · Cliente Final",
        src: recargaFeed.url,'''
          if 'value: "12.400"' not in s:
              s = s.replace(recarga_anchor, recarga_insert, 1)

          indique_anchor = '''    pieces: [
      {
        badge: "Feed · CTA",
        client: "BrasilCard · Cliente Final",
        src: indiqueCta.url,'''
          indique_insert = '''    channels: ["Instagram", "WhatsApp", "Site", "App"],
    indicators: ["Cliques no CTA", "Compartilhamentos", "Indicações realizadas", "Conversões", "Novos usuários"],
    pieces: [
      {
        badge: "Feed · CTA",
        client: "BrasilCard · Cliente Final",
        src: indiqueCta.url,'''
          if 'indicators: ["Cliques no CTA"' not in s:
              s = s.replace(indique_anchor, indique_insert, 1)

          # Insert the case information immediately before the campaign pieces grid.
          if 'Objetivo e estratégia' not in s:
              marker = '            <div className="grid gap-8 md:grid-cols-2">{c.pieces.map((p) => {'
              case_block = '''            <div className="grid lg:grid-cols-[1fr_1fr] gap-8 mb-8">
              <div className="p-6 md:p-8 rounded-xl bg-surface border border-border">
                <div className="text-[10px] tracking-[0.3em] uppercase text-accent mb-4 font-semibold">Canais</div>
                <div className="flex flex-wrap gap-2">{c.channels.map((channel) => <span key={channel} className="px-3 py-1.5 rounded-full border border-border text-xs">{channel}</span>)}</div>
                <div className="text-[10px] tracking-[0.3em] uppercase text-accent mt-8 mb-4 font-semibold">Indicadores</div>
                <div className="grid sm:grid-cols-2 gap-3">{c.indicators.map((indicator) => <div key={indicator} className="text-sm text-muted-foreground">{indicator}</div>)}</div>
                {c.results && <><div className="text-[10px] tracking-[0.3em] uppercase text-accent mt-8 mb-4 font-semibold">Resultados</div><div className="grid sm:grid-cols-3 gap-3">{c.results.map((result) => <div key={result.label} className="p-4 rounded-lg border border-border"><div className="font-display font-extrabold text-2xl text-accent">{result.value}</div><div className="text-[10px] uppercase tracking-[0.15em] text-muted-foreground mt-2">{result.label}</div></div>)}</div></>}
              </div>
              <div className="p-6 md:p-8 rounded-xl bg-surface/60 border border-border">
                <div className="text-[10px] tracking-[0.3em] uppercase text-accent mb-3 font-semibold">Objetivo e estratégia</div>
                <p className="text-sm md:text-base leading-relaxed text-foreground/90">{c.strategy}</p>
              </div>
            </div>

            <div className="grid gap-8 md:grid-cols-2">{c.pieces.map((p) => {'''
              s = s.replace(marker, case_block, 1)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Generate portfolio PDF from original PPTX
        run: |
          mkdir -p /tmp/portfolio-pdf
          libreoffice --headless --convert-to pdf --outdir /tmp/portfolio-pdf public/antonio-fontes-portfolio.pptx
          cp /tmp/portfolio-pdf/antonio-fontes-portfolio.pdf public/antonio-fontes-portfolio.pdf

      - name: Verify source changes
        run: |
          grep -q 'Copywriting · Marketing Digital' src/routes/index.tsx
          grep -q 'Estratégia se mede pelo' src/routes/index.tsx
          grep -q 'Campanhas e conteúdos desenvolvidos para' src/routes/index.tsx
          grep -q '12.400' src/routes/index.tsx
          grep -q '35%' src/routes/index.tsx
          grep -q '2.800' src/routes/index.tsx
          grep -q 'Objetivo e estratégia' src/routes/index.tsx
          grep -q 'indicators: \["Cliques no CTA"' src/routes/index.tsx
          grep -q 'Baixar portfólio (PDF)' src/routes/index.tsx
          grep -q 'download="antonio-fontes-portfolio.pptx"' src/routes/index.tsx
          ! grep -q 'Baixar currículo (PDF)' src/routes/index.tsx

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/index.tsx public/antonio-fontes-portfolio.pdf
          if git diff --cached --quiet; then
            echo "Nenhuma alteração necessária."
          else
            git commit -m "feat: atualiza cases e indicadores do portfolio"
            git push
          fi