name: Fix portfolio year labels

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-years:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ajustar anos da trajetória
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/routes/index.tsx')
          s = p.read_text(encoding='utf-8')
          old = 'font-display font-extrabold text-4xl md:text-5xl tracking-[-0.06em] text-accent leading-none'
          new = 'font-display font-extrabold text-[2.25rem] md:text-[2.5rem] tracking-[-0.08em] text-accent leading-none whitespace-nowrap'
          if old in s:
              s = s.replace(old, new, 1)
          else:
              s = s.replace('font-display font-extrabold text-4xl md:text-5xl tracking-[-0.06em] text-accent leading-none', new, 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/index.tsx
          if git diff --cached --quiet; then
            echo "Nenhuma alteração necessária."
          else
            git commit -m "fix: reduzir anos da trajetória profissional"
            git push
          fi
