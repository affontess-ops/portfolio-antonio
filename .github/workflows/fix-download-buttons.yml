name: Fix portfolio year labels

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-years:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ajustar anos da trajetória
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/routes/index.tsx')
          s = p.read_text(encoding='utf-8')
          import re
          pattern = r'font-display font-extrabold text-\[[^]]+\] md:text-\[[^]]+\] tracking-\[[^]]+\] text-accent leading-none whitespace-nowrap'
          new = 'font-display font-extrabold text-[2.15rem] md:text-[2.35rem] tracking-[-0.07em] text-accent leading-none whitespace-nowrap'
          s = re.sub(pattern, new, s, count=1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/index.tsx
          if git diff --cached --quiet; then
            echo "Nenhuma alteração necessária."
          else
            git commit -m "fix: ajustar tamanho dos anos da trajetória"
            git push
          fi
