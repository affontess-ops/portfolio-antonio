name: Fix portfolio downloads

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-downloads:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PDF conversion tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libreoffice

      - name: Create portfolio PDF from original PPTX
        run: |
          mkdir -p /tmp/portfolio-pdf
          libreoffice --headless --convert-to pdf --outdir /tmp/portfolio-pdf public/antonio-fontes-portfolio.pptx
          cp /tmp/portfolio-pdf/antonio-fontes-portfolio.pdf public/antonio-fontes-portfolio.pdf

      - name: Update download buttons
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/routes/index.tsx')
          s = p.read_text(encoding='utf-8')
          start = s.index('          <div className="flex flex-wrap gap-3 mt-8">')
          end = s.index('          </div>', start) + len('          </div>')
          new = '''          <div className="flex flex-wrap gap-3 mt-8">
            <a
              href="/antonio-fontes-portfolio.pdf"
              download="antonio-fontes-portfolio.pdf"
              type="application/pdf"
              className="inline-flex items-center gap-2 px-6 py-3 rounded-full bg-accent text-primary-foreground font-semibold text-sm tracking-wide hover:opacity-90 transition-opacity"
            >
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
              Baixar portfólio (PDF)
            </a>
            <a
              href="/antonio-fontes-portfolio.pptx"
              download="antonio-fontes-portfolio.pptx"
              type="application/vnd.openxmlformats-officedocument.presentationml.presentation"
              className="inline-flex items-center gap-2 px-6 py-3 rounded-full border border-accent text-accent font-semibold text-sm tracking-wide hover:bg-accent/10 transition-colors"
            >
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2 2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
              Baixar portfólio (PPTX)
            </a>
          </div>'''
          p.write_text(s[:start] + new + s[end:], encoding='utf-8')
          PY

      - name: Verify
        run: |
          test -f public/antonio-fontes-portfolio.pdf
          grep -q 'Baixar portfólio (PDF)' src/routes/index.tsx
          grep -q 'download="antonio-fontes-portfolio.pptx"' src/routes/index.tsx
          ! grep -q 'Baixar currículo (PDF)' src/routes/index.tsx

      - name: Commit only when files changed
        run: |
          if git diff --quiet -- src/routes/index.tsx public/antonio-fontes-portfolio.pdf; then
            echo "Nenhuma alteração necessária."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/index.tsx public/antonio-fontes-portfolio.pdf
          git commit -m "fix: downloads do portfolio"
          git push